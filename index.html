<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hub · Home for Sites</title>
  <!-- Font & Icons (optional but beautifies) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    
  </style>
</head>
<body>
  <div class="hub-card">
    <!-- header -->
    <div class="header">
      <div class="title-group">
        <i class="fas fa-graduation-cap"></i>
        <h1>STUDENTS' PORTFOLIO</h1>
      </div>
      <span class="subhead">
        <i class="fas fa-globe"></i>  ONAT SITE
      </span>
    </div>

    <!-- student grid : M3101–M3130 + M3201–M3203 -->
    <div class="student-grid" id="studentGrid">
      <!-- Will be populated by JavaScript -->
    </div>

    <!-- footer -->
    <div class="footer-meta">
      <span class="badge-count">
        <i class="fas fa-users"></i> <span id="studentCount">33</span> students
      </span>
      <span class="click-hint">
        <i class="fas fa-arrow-right"></i> click any card → open site
      </span>
    </div>
  </div>
  
  <script src="javascript/script.js"></script>
</body>
</html>
